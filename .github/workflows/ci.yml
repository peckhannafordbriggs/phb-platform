name: CI

# Every push and every pull request. This is the gate that has to stay green
# between now and provisioning, which is why it shares no job with deployment.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # A newer push to the same ref makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the first query races the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Two DIFFERENT databases. tests/setup.ts and scripts/setup-test-db.ts both
      # refuse to run if these match, because the suite truncates every table.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phb_platform
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/phb_platform_test
      # lib/env.ts parses the environment at import time, so `next build` needs
      # these to exist. They are placeholders and are not secrets - the test
      # suite overrides the auth values with its own fixed ones anyway.
      AUTH_SECRET: ci-placeholder-not-a-secret
      AUTH_MICROSOFT_ENTRA_ID_ID: 00000000-0000-0000-0000-000000000000
      AUTH_MICROSOFT_ENTRA_ID_TENANT_ID: 00000000-0000-0000-0000-000000000000
      ALLOWED_EMAIL_DOMAINS: example.invalid
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` rather than `npm install`: installs the lockfile exactly, and
      # fails instead of silently resolving a different tree.
      - name: Install dependencies
        run: npm ci

      # Chromium for tests/bas-reports-pdf.test.ts, which prints a report the
      # way the BAS Reports worker does (Dockerfile.bas-reports installs the
      # same browser the same way). The version is pinned by `playwright` in
      # package-lock.json; --with-deps adds its apt packages on the runner.
      # --only-shell: the headless shell is the binary a headless launch runs
      # and the only one the image carries, so the tests print with exactly
      # what the worker has and fail here if that is ever not enough.
      - name: Install Chromium for the PDF tests
        run: npx playwright install --with-deps --only-shell chromium

      # lib/generated is gitignored, so nothing typechecks until this runs.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create and migrate the test database
        run: npm run db:test:setup

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Builds the production image and proves it boots, without pushing anything.
  #
  # This is the check nobody can run without Docker installed, which is the point
  # of having CI do it. A Dockerfile that builds but does not boot is worth
  # nothing, so this does not stop at `docker build`.
  image:
    name: Container image builds and boots
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phb_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push: false - nothing leaves the runner. load: true puts the image into
      # the local daemon so the next steps can actually run it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: phb-platform:ci
          # Layer cache across runs, so a change that does not touch the
          # lockfile skips the dependency install entirely.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: It does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id phb-platform:ci -u)"
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "The image runs as root. The Dockerfile sets USER node."
            exit 1
          fi

      # --network host so the container reaches the Postgres service container on
      # localhost, the same address the runner sees it on.
      #
      # No migrations are applied first, deliberately: /api/health must answer
      # without touching the database, and this proves it. If a future change
      # gives the probe a query, this step starts failing - which is the warning
      # worth having, because a probe that depends on Postgres turns a brief
      # outage into a restart loop.
      - name: It boots and serves
        run: |
          docker run -d --name phb-ci --network host \
            -e DATABASE_URL='postgresql://postgres:postgres@localhost:5432/phb_platform' \
            -e AUTH_SECRET='ci-placeholder-not-a-secret' \
            -e AUTH_MICROSOFT_ENTRA_ID_ID='00000000-0000-0000-0000-000000000000' \
            -e AUTH_MICROSOFT_ENTRA_ID_TENANT_ID='00000000-0000-0000-0000-000000000000' \
            -e ALLOWED_EMAIL_DOMAINS='example.invalid' \
            phb-platform:ci

          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)"
            if [ "$code" = "200" ]; then
              echo "healthy after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "The container never answered /api/health with 200. Last: $code"
              exit 1
            fi
            sleep 2
          done

          echo "--- the probe reports up/down and nothing else ---"
          body="$(curl -fsS http://localhost:3000/api/health)"
          echo "$body"
          test "$body" = '{"status":"ok"}'

          echo "--- a rendered page, so the Next build is genuinely working ---"
          curl -fsS -o /dev/null -w 'signin: %{http_code}\n' http://localhost:3000/signin

          echo "--- an API route still rejects an unauthenticated caller ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/me)"
          echo "api/me: $code"
          test "$code" = "401"

      - name: Container logs
        if: failure()
        run: docker logs phb-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f phb-ci || true

  # Builds the BAS Reports jobs image (Dockerfile.bas-reports) and proves it
  # prints, without pushing anything (2026-11-16).
  #
  # Until this job, only deploy.yml built that image - on a merge to main,
  # after the web image - so a jobs Dockerfile that did not build, or a
  # browser that would not launch, failed the deploy rather than the pull
  # request. The image's own RUN check (launch, print '<p>ok</p>') runs
  # during the build here, so the build step alone already fails on it.
  # The steps after it go further, at RUN time and as the user the jobs run
  # as: the same check again, then the worker's real path - the report
  # template rendered under tsx (the loader the jobs use, which compiles JSX
  # differently from Next and vitest) and printed by the worker's own
  # Chromium renderer, from the shared fixture document mounted in read-only
  # (tests/ is in .dockerignore and never enters the image).
  reports-image:
    name: Reports jobs image builds and prints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Its own cache scope: the web image's job uses the default one, and
      # two images writing one scope evict each other's layers.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bas-reports
          push: false
          load: true
          tags: bas-reports:ci
          cache-from: type=gha,scope=bas-reports
          cache-to: type=gha,mode=max,scope=bas-reports

      - name: It does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id bas-reports:ci -u)"
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "The jobs image runs as root. Dockerfile.bas-reports sets USER node."
            exit 1
          fi

      - name: Chromium launches and prints at run time
        run: |
          docker run --rm --entrypoint node bas-reports:ci -e "require('playwright').chromium.launch().then(async (b) => { const p = await b.newPage(); await p.setContent('<p>ok</p>'); const pdf = await p.pdf({ format: 'Letter' }); await b.close(); if (pdf.length < 100) throw new Error('empty pdf'); console.log('chromium prints: ' + pdf.length + ' bytes'); })"

      - name: The worker's renderer prints a report under tsx
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" --entrypoint npx bas-reports:ci tsx -e '
            import { reportDocument } from "./tests/fixtures/bas-report-document";
            import { renderReportHtml } from "./lib/modules/bas/reports/engine/html";
            import { createChromiumRenderer, looksLikePdf } from "./lib/modules/bas/reports/pdf/render";
            (async () => {
              const html = renderReportHtml(reportDocument());
              if (!html.includes("BAS Health Report")) throw new Error("the template did not render");
              const renderer = createChromiumRenderer();
              try {
                const pdf = await renderer.render({ html, title: "CI check", period: "2 Nov to 9 Nov 2026" });
                if (!looksLikePdf(pdf)) throw new Error("not a PDF");
                console.log("report printed: " + pdf.length + " bytes from " + html.length + " characters of HTML");
              } finally {
                await renderer.close();
              }
            })().catch((e) => { console.error(e); process.exit(1); });
          '

  # Validates the infrastructure definition without an Azure subscription.
  # `az bicep build` is a compile, not a deployment, so it needs no credentials
  # and runs on every push from today.
  infra:
    name: Bicep compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      # `az bicep build` runs the linter as part of compiling, so this is both
      # checks. It resolves no Azure resources and needs no login.
      - name: Compile and lint
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
